# @Author: sm
# @Date: 2026-09-14 09:43:04
# @LastEditTime: 2026-09-14 09:43:04
# @FilePath: .github/ISSUE_TEMPLATE/feature_request.yml
name: Feature Request
description: Suggest an idea or improvement for Codenotch.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Codenotch!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? A clear description of what the problem is (e.g. "I'm always frustrated when...").
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Mockups
      description: Add any mockups, screenshots, or design thoughts here.
    validations:
      required: false
